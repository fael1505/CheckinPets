name: Build & Publish APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag da versão (ex: v1.1.3). Se vazio, lê versionName de app/build.gradle.kts'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON nao configurado em Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Decode Android debug.keystore
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE" ]; then
            echo "::error::Secret ANDROID_DEBUG_KEYSTORE nao configurado em Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Determine release tag
        id: meta
        shell: bash
        run: |
          TAG="${{ github.event.inputs.version_tag }}"
          if [ -z "$TAG" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v${VERSION_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "CheckinPets-${TAG}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Check-in Pets ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          files: CheckinPets-${{ steps.meta.outputs.tag }}.apk
